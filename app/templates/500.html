{% extends "base.html" %}

{% block title %}Ошибка сервера{% endblock %}

{% block content %}
<section class="py-28">
    <div class="max-w-xl mx-auto px-6 text-center">
        <p class="text-7xl md:text-8xl font-extrabold bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent mb-6 select-none">500</p>
        <h1 class="text-2xl md:text-3xl font-bold text-gray-900 mb-3">Что-то пошло не так</h1>
        <p class="text-sm text-gray-500 leading-relaxed mb-8">
            На сервере произошла ошибка. Мы уже получили информацию о ней. Попробуйте обновить страницу или зайти чуть позже.
        </p>
        <div class="flex flex-col sm:flex-row justify-center gap-3">
            <button type="button" onclick="location.reload()"
                    class="inline-flex items-center justify-center text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700 px-6 py-3 rounded-xl transition-colors">
                Обновить страницу
            </button>
            <a href="/"
               class="inline-flex items-center justify-center text-sm font-semibold text-gray-700 bg-white border border-gray-300 hover:border-gray-400 hover:bg-gray-50 px-6 py-3 rounded-xl transition-colors">
                На главную
            </a>
        </div>
    </div>
</section>
{% endblock %}
